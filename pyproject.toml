[tool.poetry]
name = "rd-flip-be"
version = "0.1.0"
description = "RD Flip backend API"
authors = ["Praveen Maurya"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
django = "^4.2"
djangorestframework = "^3.15"
django-environ = "^0.11"
psycopg2-binary = "^2.9"
django-cors-headers = "^4.4"
pillow = "^12.3.0"
djangorestframework-simplejwt = "^5.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
